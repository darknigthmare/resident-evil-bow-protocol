name: Integrate tested encounter journal
on:
  push:
    branches: ['codex/v0.7.1-encounter-journal']
    paths: ['.github/workflows/integrate-journal071.yml']
permissions:
  contents: write
concurrency:
  group: bow-integrate-journal071
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v0.7.1-encounter-journal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply checksum-guarded text edits
        run: python3 scripts/integrate-journal071.py
      - name: Compile version metadata and compatibility contracts
        run: |
          node scripts/finalize-v071.mjs
          node scripts/contract.mjs --write
          node scripts/context-contract.mjs --write
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - run: npm run verify
      - run: python3 scripts/release-v071.py
      - run: npm run build
      - name: Commit tested generated source only on continuation branch
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: contextual objectives, verified local journal and experimental controls'
          git push origin HEAD:codex/v0.7.1-encounter-journal
