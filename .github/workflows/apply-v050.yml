name: Apply B.O.W. Protocol v0.5.0

on:
  push:
    branches:
      - codex/v0.5-e001-family-protocol
    paths:
      - .github/workflows/apply-v050.yml

permissions:
  contents: write

concurrency:
  group: bow-v050-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v0.5-e001-family-protocol

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install generation and QA backends
        run: |
          python3 -m pip install --quiet pillow
          npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80

      - name: Generate E-001 Family content
        run: |
          python3 scripts/bootstrap-v050-data.py
          python3 scripts/bootstrap-v050-ui.py
          python3 scripts/fix-v050-runtime.py
          python3 scripts/build-lore-movesets.py
          python3 scripts/compile-content.py

      - name: Run complete QA
        run: npm run verify

      - name: Generate release documentation
        run: python3 scripts/generate-v050-docs.py

      - name: Build production bundle
        run: npm run build

      - name: Validate v0.5.0 release contract
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');const d=require('./data/roster.json');const m=require('./docs/RELEASE_MANIFEST_v0.5.0.json');if(p.version!=='0.5.0'||d.counts.fighters!==99||d.counts.loreMoves!==990||d.counts.stories!==99||d.counts.finishers!==396||m.verification.passed!==61)process.exit(1)"
          test -s dist/index.html
          test -s dist/movesets.html
          test -s dist/operations.html
          test -s dist/modules/versus.html

      - name: Commit verified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "B.O.W. Protocol CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "feat: B.O.W. Protocol v0.5.0 E-001 Family Protocol"
          git push origin HEAD:codex/v0.5-e001-family-protocol
