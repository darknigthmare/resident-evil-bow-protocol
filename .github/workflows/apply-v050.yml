name: Apply B.O.W. Protocol v0.5.0

on:
  push:
    branches:
      - codex/v0.5-e001-family-protocol
    paths:
      - .github/workflows/apply-v050.yml

permissions:
  contents: write

concurrency:
  group: bow-v050-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATCH_FILE_ID: "18encWJjaJUsXw-NpOlAIfvB4NDrccr8E"
      PATCH_SHA256: "463551e35c50128679c25a2ad4302cb1b66ae02a48f5a830667b3f0bfc6da77b"
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v0.5-e001-family-protocol

      - name: Download verified E-001 Family patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=${PATCH_FILE_ID}" -O /tmp/bow-v050.zip
          echo "$PATCH_SHA256  /tmp/bow-v050.zip" | sha256sum -c -
          unzip -q -o /tmp/bow-v050.zip -d "$GITHUB_WORKSPACE"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install native Canvas QA backend
        run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80

      - name: Run complete QA
        run: npm run verify

      - name: Build production bundle
        run: npm run build

      - name: Validate v0.5.0 release contract
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');const d=require('./data/roster.json');const m=require('./docs/RELEASE_MANIFEST_v0.5.0.json');if(p.version!=='0.5.0'||d.counts.fighters!==99||d.counts.loreMoves!==990||m.verification.passed!==61)process.exit(1)"
          test -s dist/index.html
          test -s dist/movesets.html
          test -s dist/operations.html
          test -s dist/modules/versus.html

      - name: Commit verified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "B.O.W. Protocol CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "feat: B.O.W. Protocol v0.5.0 E-001 Family Protocol"
          git push origin HEAD:codex/v0.5-e001-family-protocol
