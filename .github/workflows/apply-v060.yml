name: Integrate reviewed Uroboros sources
on:
  push:
    branches: ['codex/v0.6-uroboros-ascension']
    paths: ['.github/workflows/apply-v060.yml']
permissions:
  contents: write
concurrency:
  group: bow-integrate-v060
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v0.6-uroboros-ascension
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - name: Apply reviewed local-only migrations
        run: |
          python3 scripts/apply-v060-uroboros.py
          python3 scripts/integrate-v060.py
          python3 scripts/build-lore-movesets.py
          python3 scripts/compile-content.py
      - run: npm run verify
      - run: python3 scripts/release-v060.py
      - run: npm run build
      - name: Commit validated generated content to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate 16 RE5 subjects, biology, fixed routes and coverage register'
          git push origin HEAD:codex/v0.6-uroboros-ascension
