name: R20 player interface and sprites browser regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/r20-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interface-r20-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Historical canvas assertions predate the optional avatar presentation.
          ref: 545b10d17c49fcca47a03281bf1099a26c7b1ce1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80 playwright@1.64.1
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: npm run verify:r20:http
      - name: Preserve executed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interface-r20-http-${{ github.run_id }}
          path: |
            qa-interface-r20/
            qa-player-shell-r20/
            qa-sprites-r20/
          if-no-files-found: warn
          retention-days: 14
