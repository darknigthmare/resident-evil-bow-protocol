name: Apply B.O.W. Protocol v0.3.0

on:
  push:
    branches:
      - codex/v0.3-re7-bosses

permissions:
  contents: write

concurrency:
  group: bow-v030-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATCH_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-a328-820a-b7a0-1d3f6272b53b/raw?se=2026-10-11T00%3A04%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=c515468c-439c-5d56-b562-1db673b9e236&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T05%3A49%3A05Z&ske=2026-10-11T05%3A49%3A05Z&sks=b&skv=2026-02-06&sig=sJ1/a5qHSm64Qhf26fH9NNOS24ewzYMphpmy7G1fopM%3D"
      PATCH_SHA256: "1d1df949a1e23bf123c19d73e79bfdefa0f4d52734c6dfea5067f82e04546a9f"
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v0.3-re7-bosses

      - name: Download verified Incident Baker patch
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 "$PATCH_URL" -o /tmp/bow-v030.zip
          echo "$PATCH_SHA256  /tmp/bow-v030.zip" | sha256sum -c -
          unzip -q -o /tmp/bow-v030.zip -d "$GITHUB_WORKSPACE"

      - name: Install native Canvas QA backend
        run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80

      - name: Normalize Canvas image loading across QA backends
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/engine-vm.cjs')
          source = path.read_text(encoding='utf-8')
          old = "const im=new native.Image();im.onload=()=>{im.decode().then(()=>resolve(im),reject)};im.onerror=reject;"
          new = "const im=new native.Image();im.onload=()=>resolve(im);im.onerror=reject;"
          if old not in source:
              raise SystemExit('Canvas adapter signature not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Run complete QA
        run: npm run verify

      - name: Build production bundle
        run: npm run build

      - name: Validate v0.3.0 release contract
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');const d=require('./data/roster.json');if(p.version!=='0.3.0'||d.counts.fighters!==81||d.counts.loreMoves!==810)process.exit(1)"
          test -s dist/index.html
          test -s dist/movesets.html
          test -s dist/modules/versus.html

      - name: Commit verified release to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v030.yml .github/workflows/bootstrap-source.yml .github/workflows/bootstrap-source-v2.yml
          git config user.name "B.O.W. Protocol CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: B.O.W. Protocol v0.3.0 Incident Baker"
          git push origin HEAD:codex/v0.3-re7-bosses
