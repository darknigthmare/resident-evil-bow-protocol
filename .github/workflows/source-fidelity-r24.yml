name: R24 source assets, replay verification and access
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-fidelity-r24-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      AXE_CORE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
      BOW_R24_PERF_ACTIONS: '1000'
      BOW_R24_PERF_DWELL_MS: '180000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install pinned validation tools
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/fidelity-r24-venv"
          "$RUNNER_TEMP/fidelity-r24-venv/bin/python" -m pip install --timeout 60 --retries 2 Pillow==12.3.0 openpyxl==3.1.5
          npm install --no-audit --no-fund --no-save --package-lock=false --fetch-timeout=60000 --fetch-retries=2 playwright@1.64.1 @napi-rs/canvas@0.1.80 axe-core@4.14.0
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Reproduce the committed catalogue, scan and workbook before reports are regenerated
        run: |
          mkdir -p qa-fidelity-r24-ci
          "$RUNNER_TEMP/fidelity-r24-venv/bin/python" scripts/build-model-catalog-r24.py --check > qa-fidelity-r24-ci/catalogue-check.json
          "$RUNNER_TEMP/fidelity-r24-venv/bin/python" scripts/scan-source-motion-r24.py --check > qa-fidelity-r24-ci/motion-scan-check.json
          "$RUNNER_TEMP/fidelity-r24-venv/bin/python" scripts/export-fidelity-progress-r24.py --tracking docs/R24_TRACKING.json --baseline docs/BOW_FIDELITE_R23.xlsx --output qa-fidelity-r24-ci/BOW_FIDELITE_R24.xlsx --progress qa-fidelity-r24-ci/R24_PROGRESS.json
          cmp qa-fidelity-r24-ci/R24_PROGRESS.json modules/fidelity-r24/progress.json
          "$RUNNER_TEMP/fidelity-r24-venv/bin/python" - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          from openpyxl import load_workbook

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('export_r24', root / 'scripts/export-fidelity-progress-r24.py')
          exporter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(exporter)
          expected = load_workbook(root / 'docs/BOW_FIDELITE_R24.xlsx')
          actual = load_workbook(root / 'qa-fidelity-r24-ci/BOW_FIDELITE_R24.xlsx')
          try:
              assert actual.sheetnames == expected.sheetnames, 'Workbook sheets differ from the committed release'
              for name in expected.sheetnames:
                  assert exporter.worksheet_state(actual[name]) == exporter.worksheet_state(expected[name]), name
              result = {'reproduced_sheets': len(expected.sheetnames), 'progress_bytes_equal': True,
                        'scope': 'Values, formulas, cell styles, links, comments, merged cells and frozen panes; ZIP timestamps excluded.'}
              (root / 'qa-fidelity-r24-ci/workbook-check.json').write_text(json.dumps(result, indent=2) + '\n')
          finally:
              actual.close()
              expected.close()
          PY
      - name: Validate Python imports, source provenance and export guards
        run: |
          "$RUNNER_TEMP/fidelity-r24-venv/bin/python" -m unittest discover -s tests -p 'test_*r24.py' -v
      - name: Validate source transport, all source skeletons and replay reconstruction
        run: |
          node tests/verify-model-assets-r24.mjs
          node tests/verify-model-skeletons-r24.mjs > qa-fidelity-r24-ci/model-skeletons.json
          node tests/verify-persistence-r24.mjs
          node tests/verify-preservation-r20.mjs
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            node --input-type=module -e "import {chromium} from 'playwright'; console.log('CHROME_BIN=' + chromium.executablePath())" >> "$GITHUB_ENV"
          fi
      - name: Exercise original OBJ models and source textures
        run: node tests/browser-visual-models-r24.mjs
      - name: Exercise all source model and motion files
        run: node tests/browser-models-r24.mjs
      - name: Exercise documentary audio decoding and controls
        run: node tests/browser-audio-r24.mjs
      - name: Exercise canonical evidence and source boundaries
        run: node tests/browser-canonical-r24.mjs
      - name: Exercise actual-engine replay reconstruction
        run: node tests/browser-persistence-r24.mjs
      - name: Exercise the source dashboard and Bestiary access
        run: node tests/browser-fidelity-dashboard-r24.mjs
      - name: Exercise keyboard, reflow and simulated gamepad access
        run: node tests/browser-access-r24.mjs
      - name: Exercise paced source stress and resource lifetime
        run: node tests/browser-perf-r24.mjs
      - name: Publish completed browser failures as GitHub annotations
        if: always()
        run: node tests/ci-report-r25.mjs qa-visual-models-r24 qa-models-r24-browser qa-audio-r24-browser qa-canonical-r24 qa-persistence-r24-browser qa-fidelity-r24-dashboard qa-access-r24 qa-perf-r24
      - name: Build the complete static delivery
        run: npm run build
      - name: Preserve executed R24 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fidelity-r24-${{ github.run_id }}
          path: |
            qa-*r24*/
            !qa-persistence-r24-fixtures/legacy-runtime/**
            docs/R24_ACCESS_BROWSER.json
            docs/R24_ACCESS_PERFORMANCE.json
            docs/R24_*TEST*.json
          if-no-files-found: warn
          retention-days: 14
