name: R23 parallel fidelity workstreams
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-fidelity-r23-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install evidence tools
        run: |
          python3 -m venv "$RUNNER_TEMP/fidelity-r23-venv"
          "$RUNNER_TEMP/fidelity-r23-venv/bin/python" -m pip install 'Pillow>=10,<13' 'openpyxl>=3.1,<4'
          npm install --no-save --package-lock=false playwright@1.64.1 @napi-rs/canvas@0.1.80
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Reproduce the evidence workbook
        run: |
          "$RUNNER_TEMP/fidelity-r23-venv/bin/python" scripts/export-fidelity-progress-r23.py --output "$RUNNER_TEMP/BOW_FIDELITE_R23.xlsx" --progress "$RUNNER_TEMP/R23_PROGRESS.json"
      - name: Validate source pixels, provenance and historical formats
        run: |
          "$RUNNER_TEMP/fidelity-r23-venv/bin/python" -m unittest discover -s tests -p 'test_*r23.py' -v
          node tests/verify-persistence-r23.mjs
          node scripts/audit-conclusions-r23.mjs --check
          node tests/verify-preservation-r20.mjs
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            node --input-type=module -e "import {chromium} from 'playwright'; console.log('CHROME_BIN=' + chromium.executablePath())" >> "$GITHUB_ENV"
          fi
      - name: Exercise sources, keyboard navigation and local imports
        run: |
          node tests/browser-manual-motion-r23.mjs
          node tests/browser-visual-r23.mjs
          node tests/browser-canonical-r23.mjs
          node tests/browser-persistence-r23.mjs
          node tests/browser-fidelity-r23.mjs
          node tests/browser-fidelity-dashboard-r23.mjs
      - name: Build the complete static delivery
        run: npm run build
      - name: Preserve executed browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fidelity-r23-${{ github.run_id }}
          path: |
            qa-*r23*/
          if-no-files-found: warn
          retention-days: 14
