name: Bootstrap verified B.O.W. Protocol source v2

on:
  push:
    paths:
      - .github/workflows/bootstrap-source-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bow-protocol-bootstrap
  cancel-in-progress: false

jobs:
  import-complete-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PART_01_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-f804-820a-a35e-fc1e4b57dcd0/raw?se=2026-10-10T23%3A23%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=36529ab6-428b-5da9-8d21-48d8c7c5b016&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T02%3A43%3A14Z&ske=2026-10-11T02%3A43%3A14Z&sks=b&skv=2026-02-06&sig=SmCpUzgrDPAeZgG2ij4hWfn7lLYKgKaWCWf/xOBx/cU%3D"
      PART_02_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b20c-820a-8e7d-fc84cb9b816e/raw?se=2026-10-10T23%3A23%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=ac8ccc01-3d9c-585f-a58f-99fb51841dc5&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T05%3A09%3A08Z&ske=2026-10-11T05%3A09%3A08Z&sks=b&skv=2026-02-06&sig=V5Ut4A1modzNZARf4wHYhrAyLqK/u50BMBTY3bfsNTg%3D"
      PART_03_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-e530-820a-b25e-50ab45e632a4/raw?se=2026-10-10T23%3A24%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=335a0ae7-3f62-501e-baa0-66ba5d004c7a&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T22%3A18%3A42Z&ske=2026-10-11T22%3A18%3A42Z&sks=b&skv=2026-02-06&sig=HI40HByiKMTz1zSHIr0Y2aVdIG8c45%2B2cPR1WqWcnGo%3D"
      PART_04_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-3b00-820a-91f5-ba3ca2bb823a/raw?se=2026-10-10T23%3A24%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=312edaaf-62a7-5532-a94f-489cc63ee33e&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T03%3A23%3A05Z&ske=2026-10-11T03%3A23%3A05Z&sks=b&skv=2026-02-06&sig=u0bt%2B0QnGBo%2BbkF9O/Uq5giuOfGYjSLbuYtHTr9uUAQ%3D"
      PART_05_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-ffdc-820a-b5ce-75068c45b432/raw?se=2026-10-10T23%3A24%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=e84c8387-3831-5d53-be5e-49970c97f213&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T06%3A51%3A15Z&ske=2026-10-11T06%3A51%3A15Z&sks=b&skv=2026-02-06&sig=M%2B2tURHoTeyWgmXzY1FjCdjLLrx53%2BN7BDyTDOOWtrk%3D"
      FINAL_ZIP_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b2a4-820a-b799-8c5d6e047d54/raw?se=2026-10-10T23%3A24%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=c5ed3393-8c41-549a-a93d-48b1333356b6&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T22%3A27%3A47Z&ske=2026-10-11T22%3A27%3A47Z&sks=b&skv=2026-02-06&sig=Y4/YMapD9eSJo1%2BTsmHUQuZnYd3czCaisyajOA%2BNFhw%3D"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify split source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bow-source"
          cd "$RUNNER_TEMP/bow-source"
          curl -fsSL --retry 5 --retry-all-errors -o BOW.z01 "$PART_01_URL"
          curl -fsSL --retry 5 --retry-all-errors -o BOW.z02 "$PART_02_URL"
          curl -fsSL --retry 5 --retry-all-errors -o BOW.z03 "$PART_03_URL"
          curl -fsSL --retry 5 --retry-all-errors -o BOW.z04 "$PART_04_URL"
          curl -fsSL --retry 5 --retry-all-errors -o BOW.z05 "$PART_05_URL"
          curl -fsSL --retry 5 --retry-all-errors -o BOW.zip "$FINAL_ZIP_URL"
          printf '%s  %s\n' \
            '38f42e36b95507879a3b05a6c8d5a4d7304def41f5c36451f0eea9c9eb106f2d' BOW.z01 \
            '74bfbc822ee6ff90dc2d7c94d735aef077c089f95e8fb033ee9fedbbf11fecc6' BOW.z02 \
            '309f9d88c344a945ecc7e6656626393f3b6afc4bbd84bdd4b6e459a8ddf777d4' BOW.z03 \
            'f5fccc5f980eb9c2ea87d33e068b9acaf595a32780c4fc9beaa7500bc9e47122' BOW.z04 \
            '6ae725f9b93997e1f52b2970b12ca8cc39f6b8408df0c040cf504438a06e8d86' BOW.z05 \
            '6fcaac02ab757536fe46b289594979a8213a1fd496fc0bc597693fa6d309d7c8' BOW.zip > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Reconstruct and import complete project
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bow-source"
          zip -s 0 BOW.zip --out BOW-complete.zip
          unzip -q BOW-complete.zip -d extracted
          PROJECT_ROOT="$(find extracted -type f -name package.json -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_ROOT"
          rsync -a "$PROJECT_ROOT/" "$GITHUB_WORKSPACE/"
          test -f "$GITHUB_WORKSPACE/data/lore-movesets.json"
          test -d "$GITHUB_WORKSPACE/assets/catalog"

      - name: Install real native Canvas backend
        run: npm install --no-save --package-lock=false @napi-rs/canvas

      - name: Run complete QA and production build
        run: |
          npm run verify
          npm run build

      - name: Commit complete verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          rm -f .github/workflows/bootstrap-source.yml .github/workflows/bootstrap-source-v2.yml
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete B.O.W. Protocol v0.2.0 [skip ci]'
          git push origin HEAD:main
