name: Integrate and verify spatial zones v0.7.2
on:
  push:
    branches: ['codex/v0.7.2-spatial-completion']
    paths: ['.github/workflows/integrate-spatial072.yml']
permissions:
  contents: write
concurrency:
  group: bow-spatial072-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v0.7.2-spatial-completion
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply reviewed source and compatibility metadata
        run: |
          python3 scripts/integrate-spatial072.py
          node scripts/finalize-v072.mjs
          node scripts/contract.mjs --write
          node scripts/context-contract.mjs
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - run: npm run verify
      - run: python3 scripts/release-v072.py
      - run: npm run build
      - name: Commit validated source to the continuation branch only
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: spatial target zones, projectile contacts and cumulative journal integration'
          git push origin HEAD:codex/v0.7.2-spatial-completion
