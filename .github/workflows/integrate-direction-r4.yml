name: Validate reviewed directional R4
on:
  push:
    branches: ['codex/lateral-r4-validation']
    paths:
      - '.github/workflows/integrate-direction-r4.yml'
      - 'scripts/apply-directional-r4.py'
      - 'scripts/prepare-directional-r4.mjs'
      - 'scripts/directional-pair-validation.mjs'
      - 'data/directional-reference-review-r4.json'
      - 'tests/verify-directional-r4.mjs'
permissions:
  contents: write
concurrency:
  group: bow-directional-r4-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/lateral-r4-validation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - name: Integrate reviewed local references and presentation fixes
        run: |
          python3 scripts/apply-directional-r4.py
          node scripts/prepare-directional-r4.mjs
          node scripts/compile-directions.mjs --write
          node scripts/directional-workorders.mjs
      - run: node tests/verify-directional-r4.mjs
      - run: npm run verify
      - run: npm run build
      - name: Commit validated source and derivative PNGs only to staging
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'fix(render): integrate twelve reviewed native reference PNGs and dossier animation timing'
          git push origin HEAD:codex/lateral-r4-validation
