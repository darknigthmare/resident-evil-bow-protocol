name: R19 reviewed save center integration
on:
  push:
    branches: ['codex/r19-saves-build-20261021']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bow-saves-r19-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Materialize reviewed source and exact workbook
        run: |
          test "$(git merge-base f9dcf65c0b147be5942aba82ffbab738147d0481 HEAD)" = f9dcf65c0b147be5942aba82ffbab738147d0481
          python3 scripts/materialize-saves-r19.py
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80 playwright@1.64.1
      - name: Complete executable QA
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee r19-verify.log
      - run: npm run build
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: node tests/browser-save-center-r19.mjs
      - run: node tests/browser-access-context-r18.mjs
      - run: node tests/browser-combat-text-r17.mjs
      - run: node tests/browser-trial-audio-r16.mjs
      - run: node tests/browser-baker-audio-r15.mjs
      - run: node tests/browser-baker-r14.mjs
      - run: node tests/browser-replay-vault-r13.mjs
      - run: node tests/browser-flight-r12.mjs
      - run: node tests/browser-lucas-r11.mjs
      - run: node tests/browser-delivery-r10-http.mjs
      - name: Commit verified candidate on integration branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('R19_REVIEWED_PATHS.json'))+['docs/SAVES_R19_TESTS.json']
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git commit -m 'feat: R19 explicit save export, selective restore and guarded rollback, verified'
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; fi; }; f' \
            push origin HEAD:refs/heads/codex/r19-saves-build-20261021
      - name: Package exact tracked commit, not regenerated historical reports
        run: |
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          changed=[p for p in changed if p]
          assert all(p.startswith(('docs/','tests/')) and p.endswith(('.json','.md')) for p in changed),changed
          if changed:subprocess.run(['git','restore','--worktree','--',*changed],check=True)
          PY
          git diff --exit-code
          python3 scripts/package-saves-r19.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r19-report
          path: r19-delivery/00_REPORT_R19.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r19-code
          path: r19-delivery/01_CODE_R19.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r19-evidence
          path: |
            r19-verify.log
            docs/SAVES_R19_TESTS.json
            qa-saves-r19/
            qa-access-r18/
            qa-combat-text-r17/
            qa-trial-audio-r16/
            qa-audio-r15-http/
            qa-baker-r14-http/
            qa-replay-r13/
            qa-flight-r12/
            qa-lucas-r11/
            qa-r10-http/
          if-no-files-found: warn
          retention-days: 14
