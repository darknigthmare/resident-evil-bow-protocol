name: B.O.W. Protocol QA

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bow-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install native Canvas test backend
        run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80

      - name: Verify lore, engine, pages and interface
        run: npm run verify

      - name: Build static production bundle
        run: npm run build

      - name: Check release manifest and build entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/RELEASE_MANIFEST_v0.3.0.json
          test -s dist/index.html
          test -s dist/movesets.html
          test -s dist/modules/versus.html
          node -e "const m=require('./docs/RELEASE_MANIFEST_v0.3.0.json'); if(m.version!=='0.3.0'||m.counts.fighters!==81||m.counts.loreMoves!==810) process.exit(1)"
