name: B.O.W. Protocol QA
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bow-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - run: npm run verify
      - run: npm run build
      - name: Compare package, actual roster and current manifest
        run: |
          node -e "const p=require('./package.json'),r=require('./data/roster.json'),m=require('./docs/RELEASE_MANIFEST_v'+p.version+'.json');if(m.version!==p.version||r.version!==p.version||m.counts.fighters!==r.fighters.length||m.counts.loreMoves!==r.fighters.length*10)process.exit(1)"
          test -s dist/modules/versus.html
