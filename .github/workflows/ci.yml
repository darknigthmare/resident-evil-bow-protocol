name: B.O.W. Protocol QA
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bow-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - run: npm run verify
      - run: npm run build
      - name: Validate main roster and isolated annex against release manifest
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./package.json');
          const r = require('./data/roster.json');
          const m = require('./docs/RELEASE_MANIFEST_v' + p.version + '.json');
          const counts = m.productionCounts ?? m.counts;
          assert.equal(m.version, p.version);
          assert.equal(r.version, p.version);
          assert.equal(counts.fighters, r.fighters.length);
          assert.equal(counts.loreMoves, r.fighters.reduce((n, f) => n + Object.keys(f.combat.moves).length, 0));
          if (m.annexCounts) {
            const a = require('./data/catalog-expansion-v070.json');
            const ids = new Set(r.fighters.map(f => f.uid));
            const records = new Set(a.records.map(f => f.id));
            assert.equal(a.version, p.version);
            assert.equal(records.size, a.records.length);
            assert.equal(m.annexCounts.completedRecords, a.records.length);
            assert.equal(m.annexCounts.experimentalFighters, a.fighters.length);
            assert.equal(m.annexCounts.experimentalCommands, a.fighters.reduce((n, f) => n + Object.keys(f.combat.moves).length, 0));
            assert.equal(m.annexCounts.contextualEncounters, a.records.length - a.fighters.length);
            for (const f of a.fighters) { assert(!ids.has(f.uid)); assert(records.has(f.uid)); }
            for (const c of r.catalog) assert(ids.has(c.id) || records.has(c.id));
            assert.equal(ids.size + records.size, r.catalog.length);
            assert.equal(m.verification.failed, 0);
          }
          console.log('Current manifest, main roster and annex agree; no experimental promotion.');
          NODE
          test -s dist/modules/versus.html
