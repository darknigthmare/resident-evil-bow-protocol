name: Verify directional renderer integration
on:
  push:
    branches: ['codex/lateral-renderer-integration']
    paths: ['.github/workflows/integrate-directions.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/lateral-renderer-integration
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: python3 scripts/apply-reviewed-directions.py
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - run: npm run verify
      - run: npm run build
      - name: Commit verified code to draft branch only
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git commit -m 'render: integrate directional sprite resolver game-wide; artwork remains incomplete'
          git push origin HEAD:codex/lateral-renderer-integration
