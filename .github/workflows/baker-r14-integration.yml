name: R14 reviewed Baker scenes integration
on:
  push:
    branches: ['codex/r14-baker-build-20261020']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bow-baker-r14-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Preflight and materialize the reviewed visual delta
        run: |
          test "$(git merge-base c505206a06c63843533cfca046cf06544b9e1e28 HEAD)" = c505206a06c63843533cfca046cf06544b9e1e28
          python3 scripts/materialize-baker-r14.py
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80 playwright@1.64.1
      - name: Test native stage rendering and save inspectable images
        run: node tests/verify-baker-stages-r14.mjs
      - name: Run complete executable QA
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee r14-verify.log
      - run: npm run build
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: node tests/browser-baker-r14.mjs
      - run: node tests/browser-replay-vault-r13.mjs
      - run: node tests/browser-flight-r12.mjs
      - run: node tests/browser-lucas-r11.mjs
      - run: node tests/browser-delivery-r10-http.mjs
      - name: Commit verified visual candidate on this integration branch only
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add catalog-duel.html catalog-laboratory.html directions.html laboratory.html modules/chronicles.html modules/versus.html package.json sequences.html stages.html src/re-renderer.js src/stage-workshop-r6.js src/baker-stages-r14.js styles/stage-workshop-r6.css tests/r13-baseline.mjs tests/r14-baseline.mjs tests/verify-baker-stages-r14.mjs tests/browser-baker-r14.mjs docs/BAKER_R14_SCOPE.md docs/BAKER_R14_CHANGES.json docs/BAKER_R14_PRESERVATION.json docs/BAKER_R14_TESTS.json
          git diff --cached --quiet || git commit -m 'feat: R14 original garage, attic and testing-room scenes with deterministic animation'
          git push origin HEAD:refs/heads/codex/r14-baker-build-20261020
      - run: python3 scripts/package-baker-r14.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r14-report
          path: r14-delivery/00_REPORT_R14.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r14-code
          path: r14-delivery/01_CODE_R14.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Keep executed evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r14-evidence
          path: |
            r14-verify.log
            docs/BAKER_R14_TESTS.json
            qa-baker-r14/
            qa-baker-r14-http/
            qa-replay-r13/
            qa-flight-r12/
            qa-lucas-r11/
            qa-r10-http/
          if-no-files-found: warn
          retention-days: 14
