name: Recover interrupted R8 text for review
on:
  push:
    branches: ['codex/r8-sequences-recovery-20261017']
    paths: ['.github/workflows/recover-r8-text.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover bounded text only; do not execute recovered code
        run: python3 scripts/recover-r8-text.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bow-r8-recovered-text
          path: R8_RECOVERED_TEXT.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
