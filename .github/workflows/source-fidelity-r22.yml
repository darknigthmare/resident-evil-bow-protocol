name: R22 original source fidelity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-fidelity-r22-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install source validation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/source-r22-venv"
          "$RUNNER_TEMP/source-r22-venv/bin/python" -m pip install 'Pillow>=10,<13'
          npm install --no-save --package-lock=false playwright@1.64.1
      - name: Validate source import and native frame extraction
        run: |
          "$RUNNER_TEMP/source-r22-venv/bin/python" -m unittest discover -s tests -p 'test_*r2[12].py' -v
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            node --input-type=module -e "import {chromium} from 'playwright'; console.log('CHROME_BIN=' + chromium.executablePath())" >> "$GITHUB_ENV"
          fi
      - name: Validate original frame pixels and dossier presentation
        run: node tests/browser-source-motion-r22.mjs
      - name: Preserve executed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-fidelity-r22-${{ github.run_id }}
          path: qa-source-motion-r22-browser/
          if-no-files-found: warn
          retention-days: 14
