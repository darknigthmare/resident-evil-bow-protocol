name: R13 replay recovery browser regressions
on:
  pull_request:
  push:
    branches: [main, codex/lucas-devices-r11]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-r13-http-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80 playwright@1.64.1
      - run: node scripts/contract.mjs && node scripts/catalog-replay-contract.mjs
      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: node tests/browser-replay-vault-r13.mjs
      - name: Preserve executed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-r13-http-${{ github.run_id }}
          path: qa-replay-r13/
          if-no-files-found: warn
          retention-days: 14
