name: Publish v0.3.0 Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v030.yml']

permissions:
  contents: write

concurrency:
  group: bow-release-v030
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install native Canvas QA backend
        run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80

      - name: Re-run complete release QA
        run: npm run verify

      - name: Build static production bundle
        run: npm run build

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=resident-evil-bow-protocol-v0.3.0/ -o RESIDENT_EVIL_BOW_PROTOCOL_v0.3.0_SOURCE.zip HEAD
          (cd dist && zip -q -9 -r ../BOW_PROTOCOL_VERCEL_STATIC_v0.3.0.zip .)
          sha256sum RESIDENT_EVIL_BOW_PROTOCOL_v0.3.0_SOURCE.zip BOW_PROTOCOL_VERCEL_STATIC_v0.3.0.zip > BOW_PROTOCOL_v0.3.0_SHA256SUMS.txt

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.3.0 \
            RESIDENT_EVIL_BOW_PROTOCOL_v0.3.0_SOURCE.zip \
            BOW_PROTOCOL_VERCEL_STATIC_v0.3.0.zip \
            BOW_PROTOCOL_v0.3.0_SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Resident Evil — B.O.W. Protocol v0.3.0 · Incident Baker" \
            --notes-file docs/RELEASE_NOTES_v0.3.0.md
