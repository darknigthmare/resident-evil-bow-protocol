name: Integrate reviewed contacts v0.7.3
on:
  push:
    branches: ['codex/v0.7.3-contact-continuity']
    paths: ['.github/workflows/integrate-contact073.yml']
permissions:
  contents: write
concurrency:
  group: bow-integrate-contact073
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v0.7.3-contact-continuity
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: python3 scripts/apply-contact073.py
      - run: node scripts/contract.mjs --write
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - run: npm run verify
      - run: python3 scripts/release-v073.py
      - run: npm run build
      - name: Commit only tested generated content on continuation branch
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: projectile first contacts, return impacts and safe page resumption'
          git push origin HEAD:codex/v0.7.3-contact-continuity
