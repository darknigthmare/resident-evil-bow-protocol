name: Verify directional renderer R2
on:
  push:
    branches: ['codex/lateral-renderer-integration']
    paths: ['.github/workflows/integrate-direction-r2.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/lateral-renderer-integration
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: python3 scripts/integrate-direction-r2.py
      - run: node scripts/compile-directions.mjs --write && node scripts/directional-workorders.mjs
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - run: npm run verify
      - run: npm run build
      - name: Commit validated renderer and measured registry to the draft branch
        run: |
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'fix(render): directional clip frames, native reference views and asset validation'
          git push origin HEAD:codex/lateral-renderer-integration
