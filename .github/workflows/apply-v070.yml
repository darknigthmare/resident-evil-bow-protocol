name: Integrate reviewed catalog completion
on:
  push:
    branches: ['codex/v0.7-catalog-completion']
    paths: ['.github/workflows/apply-v070.yml']
permissions:
  contents: write
concurrency:
  group: bow-integrate-v070
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v0.7-catalog-completion
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80
      - name: Apply checksum-verified local files and regenerate content
        run: |
          python3 scripts/apply-reviewed-catalog-v070.py
          python3 scripts/build-catalog-v070.py
          python3 scripts/integrate-catalog-v070.py
          python3 scripts/build-lore-movesets.py
          python3 scripts/compile-content.py
          node scripts/contract.mjs --write
      - run: npm run verify
      - run: python3 scripts/release-v070.py
      - run: npm run build
      - name: Commit tested generated content to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --quiet && exit 0
          git commit -m 'feat: complete 274 catalog dossiers and add isolated experimental trials'
          git push origin HEAD:codex/v0.7-catalog-completion
