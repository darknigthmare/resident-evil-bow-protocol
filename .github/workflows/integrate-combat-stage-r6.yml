name: Validate combat and stage R6
on:
  push:
    branches: ['codex/combat-stage-r6']
    paths: ['.github/workflows/integrate-combat-stage-r6.yml', 'scripts/integrate-combat-stage-r6.py', '.github/integration/combat-stage-r6.*.b64']
permissions:
  contents: write
concurrency:
  group: bow-combat-stage-r6-integration
  cancel-in-progress: false
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/combat-stage-r6
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply exact reviewed source and regenerate content
        run: python3 scripts/integrate-combat-stage-r6.py
      - run: npm install --no-save --package-lock=false @napi-rs/canvas@0.1.80 playwright@1.51.1
      - name: Execute all test groups
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee combat-stage-r6-verify.log
      - run: npm run build
      - name: Use real Chromium for local HTTP tests
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: node tests/browser-combat-stage-r6.mjs
      - run: node tests/browser-renderer-recovery-r5.mjs
      - name: Commit verified game files to staging only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,lzma,json,subprocess
          from pathlib import Path
          b=base64.b64decode(''.join(Path(f'.github/integration/combat-stage-r6.{i}.b64').read_text().strip() for i in range(1,4)))
          p=json.loads(lzma.decompress(b))
          files=[e['path'] for e in p['entries']]+list(p['generated'])
          subprocess.run(['git','add','--',*files],check=True)
          PY
          git config user.name 'B.O.W. Protocol CI'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(combat): interruptible salvos, real super windows and four animated stage compositions'
            git push origin HEAD:codex/combat-stage-r6
          fi
      - name: Preserve real browser evidence and executed test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bow-r6-integration-evidence
          path: |
            combat-stage-r6-verify.log
            qa-combat-stage-r6/
            qa-renderer-r5/
            docs/COMBAT_STAGE_R6_TESTS.json
          compression-level: 6
          retention-days: 14
          if-no-files-found: warn
