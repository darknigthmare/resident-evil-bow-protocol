name: Audit R9 browser regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/lateral-renderer-integration]
permissions:
  contents: read
concurrency:
  group: bow-audit-r9-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Locate browser
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: node tests/browser-audit-r9.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bow-r9-browser-evidence
          path: qa-audit-r9/
          retention-days: 14
          if-no-files-found: warn
